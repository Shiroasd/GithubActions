name: CI/CD Tienda Perritos - Frontend

#holi

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"

jobs:
  build-push-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login en Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build imagen Frontend y push a ECR
      run: |
        cd frontend

        docker build -t tienda-frontend .

        docker tag tienda-frontend:latest 472329719939.dkr.ecr.us-east-1.amazonaws.com/tienda-frontend:v1

        docker push 472329719939.dkr.ecr.us-east-1.amazonaws.com/tienda-frontend:v1

    - name: Desplegar Frontend vía SSM
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_FRONTEND_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --comment "Actualizar tienda-frontend desde ECR" \
          --parameters '{
            "commands":[
              "set -e",
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 472329719939.dkr.ecr.us-east-1.amazonaws.com",
              "docker pull 472329719939.dkr.ecr.us-east-1.amazonaws.com/tienda-frontend:v1",
              "docker stop tienda-frontend || true",
              "docker rm tienda-frontend || true",
              "docker run -d --name tienda-frontend -p 80:80 472329719939.dkr.ecr.us-east-1.amazonaws.com/tienda-frontend:v1"
            ]}' \
          --output text